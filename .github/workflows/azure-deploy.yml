name: CI/CD — Build, Test & Deploy to Azure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: 'Social_Media_Chatting_APP.slnx'
  WEB_PROJECT_PATH: 'Social-Media-Chatting-APP-Web/Social-Media-Chatting-APP-Web.csproj'
  PERSISTENCE_PROJECT_PATH: 'Social-Media-Chatting-APP-Persistence/Social-Media-Chatting-APP-Persistence.csproj'
  TESTS_PROJECT_PATH: 'Social-Media-Chatting-APP-Service.Tests'
  PUBLISH_OUTPUT: './publish'
  AZURE_WEBAPP_NAME: connecto-fvfuauetc7buamaz
  AZURE_SUBSCRIPTION_ID: 'fb310b86-885a-441d-b45c-c3970be294cd'

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build & Test
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Run tests
        run: |
          dotnet test ${{ env.TESTS_PROJECT_PATH }} \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'

      - name: Publish Web project
        run: |
          dotnet publish ${{ env.WEB_PROJECT_PATH }} \
            --configuration Release \
            --output ${{ env.PUBLISH_OUTPUT }} \
            --no-restore

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-publish
          path: ${{ env.PUBLISH_OUTPUT }}

  # ─────────────────────────────────────────────
  # JOB 2: Migrate & Deploy (only on push to main)
  # ─────────────────────────────────────────────
  deploy:
    name: Migrate & Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://connecto-fvfuauetc7buamaz.westeurope-01.azurewebsites.net

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Install dotnet-ef tool
        run: dotnet tool install --global dotnet-ef

      - name: Run EF Core migrations
        run: |
          dotnet ef database update \
            --project ${{ env.PERSISTENCE_PROJECT_PATH }} \
            --startup-project ${{ env.WEB_PROJECT_PATH }} \
            --context Social_Media_Chatting_APP_DbContext
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.PRODUCTION_CONNECTION_STRING }}
          ASPNETCORE_ENVIRONMENT: Production

      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: app-publish
          path: ${{ env.PUBLISH_OUTPUT }}

      - name: Zip publish output
        run: |
          cd ${{ env.PUBLISH_OUTPUT }}
          zip -r ../app.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure subscription
        run: az account set --subscription ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy via Azure CLI zip deploy
        run: |
          az webapp deploy \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --src-path ./app.zip \
            --type zip
